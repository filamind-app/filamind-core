name: Release

# Cut a release by bumping the version in package.json and pushing a matching tag:
#   npm version patch   # or minor/major - commits + creates the vX.Y.Z tag
#   git push --follow-tags
# The npm publish step runs only when an NPM_TOKEN repo secret is set (Settings > Secrets and
# variables > Actions). Without it the publish is SKIPPED (not failed) - publish manually instead
# with `npm publish --access public` - and the GitHub Release is still created from the CHANGELOG.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm test
      - run: npm run build
      # A tagged release that does not reach npm is invisible: the GitHub Release is created, the
      # run is green, and every consumer keeps resolving the previous version. That happened to
      # v0.1.5 and v0.1.6 and went unnoticed for weeks. Fail loudly instead of skipping quietly.
      - name: Require a registry token
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not set, so this release cannot be published to npm."
            echo "::error::Set the NPM_TOKEN repository secret, or publish by hand with"
            echo "::error::  npm publish --access public"
            echo "::error::and re-run. A release that only exists on GitHub reaches no consumer."
            exit 1
          fi
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
      - name: Verify the version reached the registry
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PUBLISHED="$(npm view @filamind-app/core version)"
          echo "tag=$VERSION registry=$PUBLISHED"
          [ "$VERSION" = "$PUBLISHED" ] || {
            echo "::error::npm still serves $PUBLISHED after publishing $VERSION."
            exit 1
          }
      # Release notes come from CHANGELOG.md (not auto-generated from commits) so the
      # published text is authored and stays within the R1 no-external-refs rule.
      - name: Release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { cap=1; next }
            cap && /^## \[/ { exit }
            cap { print }
          ' CHANGELOG.md > NOTES.md
          [ -s NOTES.md ] || echo "See CHANGELOG.md for details." > NOTES.md
      - uses: softprops/action-gh-release@v3
        with:
          # Release title is the version tag ALONE; any descriptive summary lives in the release
          # commit / tag annotation, not the Release name. The body comes from CHANGELOG.md.
          name: ${{ github.ref_name }}
          body_path: NOTES.md
