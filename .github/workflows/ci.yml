name: CI
on: [push, pull_request]

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22' # matches the rest of the suite and the release workflow
      - run: npm ci
      - run: npm run type-check
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: No external-project references (R1)
        run: bash scripts/check-no-external-refs.sh
